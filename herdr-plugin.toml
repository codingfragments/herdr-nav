id = "herdr-nav"
name = "herdr-nav"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

# The switcher is a single popup: one keystroke opens it, you aim, Enter
# moves you, it closes (spec §1). There is one interactive pane and one
# launcher action — in-popup navigation (browse tree / search flat) handles
# the five target groups, so there are no per-group launcher actions.
# Bind a key to the action id via a `[[keys.command]]` entry with
# `type = "plugin_action"` in your own ~/.config/herdr/config.toml — see
# doc/keybinding.md. Herdr owns all keybindings; the plugin never binds
# its own keys.
#
# Placement is popup (centered, sizable) at 80%x80%, clamped to 100x34
# cells (spec §2). Herdr's overlay covers the whole workspace, not just
# the active pane's rect; popup leaves the surrounding workspace dimmed
# behind the switcher.

[[panes]]
id = "switcher"
title = "herdr switch"
command = ["./target/release/herdr-nav"]
placement = "popup"
width = "80%"
height = "80%"

# The capture popup (Phase C2+): a separate action that analyzes the
# current workspace and generates a workspace template YAML, with an
# optional in-flow $EDITOR fine-tune. See spec/capture-template-spec.md.
# Distinct from nav-open: this captures a template; ^t (nav-open's
# in-popup key) applies one. Bind it via a [[keys.command]] entry in
# your ~/.config/herdr/config.toml — see doc/keybinding.md.
[[panes]]
id = "capture"
title = "herdr capture"
command = ["./target/release/herdr-nav", "capture"]
placement = "popup"
width = "80%"
height = "80%"

[[actions]]
id = "nav-open"
title = "nav: switcher"
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-nav", "--entrypoint", "switcher", "--placement", "popup"]

[[actions]]
id = "nav-capture"
title = "nav: capture workspace as template"
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-nav", "--entrypoint", "capture", "--placement", "popup"]
