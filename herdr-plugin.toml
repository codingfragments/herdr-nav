id = "herdr-nav"
name = "herdr-nav"
version = "0.7.0"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]

# Puts the binary into target/release/: downloads the release binary
# for this version (no Rust needed — install option B, rex-migration
# R3), or builds from source on untagged commits / when the download
# fails. See bin/fetch-binary. `herdr plugin link` skips this step —
# run `just build` first.
[[build]]
command = ["sh", "bin/fetch-binary"]

# The switcher is a single popup: one keystroke opens it, you aim, Enter
# moves you, it closes (spec §1). There is one interactive pane and one
# launcher action — in-popup navigation (browse tree / search flat) handles
# the five target groups, so there are no per-group launcher actions.
# Bind a key to the action id via a `[[keys.command]]` entry with
# `type = "plugin_action"` in your own ~/.config/herdr/config.toml — see
# doc/keybinding.md. Herdr owns all keybindings; the plugin never binds
# its own keys.
#
# Placement is popup (centered, sizable) at 80%x80%, clamped to 100x34
# cells (spec §2). Herdr's overlay covers the whole workspace, not just
# the active pane's rect; popup leaves the surrounding workspace dimmed
# behind the switcher.

# bin/nav-launch prefers target/release/herdr-nav (fetch-binary or
# just build put it there), then a herdr-nav on PATH (mise), and pins
# NAV_HOST=herdr — a herdr running inside a Rex terminal must not be
# detected as the other multiplexer.
[[panes]]
id = "switcher"
title = "herdr switch"
command = ["sh", "bin/nav-launch"]
placement = "popup"
width = "80%"
height = "80%"

# The capture popup (Phase C2+): a separate action that analyzes the
# current workspace and generates a workspace template YAML, with an
# optional in-flow $EDITOR fine-tune. See spec/capture-template-spec.md.
# Distinct from nav-open: this captures a template; ^t (nav-open's
# in-popup key) applies one. Bind it via a [[keys.command]] entry in
# your ~/.config/herdr/config.toml — see doc/keybinding.md.
[[panes]]
id = "capture"
title = "herdr capture"
command = ["sh", "bin/nav-launch", "capture"]
placement = "popup"
width = "80%"
height = "80%"

[[actions]]
id = "nav-open"
title = "nav: switcher"
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-nav", "--entrypoint", "switcher", "--placement", "popup"]

# The agents-only switcher (feature/group-tag-filter): the same popup,
# seeded with the `@agents` group tag so it opens directly as a flat,
# fuzzy-searchable list of agent leaves (preview pane intact). Esc
# clears the seed back to the full Browse tree; second Esc closes.
# Other groups work the same way — e.g. `--seed "@zoxide"` — see
# doc/query-filters.md and doc/keybinding.md.
[[panes]]
id = "agents"
title = "herdr agents"
command = ["sh", "bin/nav-launch", "--seed", "@agents"]
placement = "popup"
width = "80%"
height = "80%"

[[actions]]
id = "nav-agents"
title = "nav: agents only"
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-nav", "--entrypoint", "agents", "--placement", "popup"]

[[actions]]
id = "nav-capture"
title = "nav: capture workspace as template"
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-nav", "--entrypoint", "capture", "--placement", "popup"]
