Design Specification<\u002Fh1>\n  <p style=\"font:14px/1.6 'IBM Plex Sans',sans-serif;color:#5b6078;margin:0 0 4px\">A popup target switcher for the <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">herdr<\u002Fspan> terminal multiplexer: one keystroke away, two modes, five target groups, live preview. Catppuccin Macchiato.<\u002Fp>\n  <p style=\"font:12px 'JetBrains Mono',monospace;color:#8087a2;margin:0 0 18px\">Audience: an implementing agent (Claude Code or equivalent). Reference prototype: <span style=\"color:#5b4bc4\">Herdr Switcher.dc.html<\u002Fspan> — behaviour there is normative where this document and the prototype agree; this document wins where they differ.<\u002Fp>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">1. Purpose and scope<\u002Fh2>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">The switcher answers one question — <em>where do I want to be?<\u002Fem> — for every kind of \"place\" herdr knows about: a live pane in the current session, an agent that is waiting on you, a directory you visit often, a plugin you want to poke. It is a modal popup over the terminal, not a persistent panel. It opens, you aim, you hit Enter, it closes and herdr has moved you.<\u002Fp>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Two hard design constraints drive everything below. First, <strong>a single keystroke must be enough to change interaction model<\u002Fstrong>: browsing structure and searching text are different tasks, so typing any printable character flips the whole left pane from a tree into a ranked flat list. Second, <strong>the preview pane never changes shape<\u002Fstrong> — it is always the answer to \"what is the thing under the cursor\", in both modes, for every node kind. That invariant is what makes the mode switch feel free rather than disorienting.<\u002Fp>\n\n  <h3 style=\"font:600 14.5px 'IBM Plex Sans',sans-serif;color:#24273a;margin:16px 0 6px\">Non-goals<\u002Fh3>\n  <ul style=\"font:14px/1.6 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px;padding-left:20px\">\n    <li>Not a session manager UI: no renaming, resizing, or layout editing beyond the destructive shortcuts listed in §8.<\u002Fli>\n    <li>Not a file browser: directory targets are jump destinations, never a path-by-path navigator.<\u002Fli>\n    <li>Not a command palette: it switches to targets, it does not run arbitrary commands.<\u002Fli>\n  <\u002Ful>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">2. Window, geometry, chrome<\u002Fh2>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">The popup is a floating, bordered, rounded rectangle centred over the dimmed host terminal. It has four horizontal bands: title bar, search bar, body (split), footer. All measurements are given in character cells for a TUI implementation, with the prototype's pixel values in parentheses.<\u002Fp>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font:12.5px 'IBM Plex Sans',sans-serif;margin:6px 0 14px\">\n    <sc-raw-thead><sc-raw-tr>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">BAND<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">HEIGHT<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">CONTENT<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">Title bar<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">1 row (34px)<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">herdr switch<\u002Fspan> left; mode badge + counts right<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">Search bar<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">1 row (46px)<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">prompt <span style=\"font-family:'JetBrains Mono',monospace\">❯<\u002Fspan>, query, block caret, placeholder<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">Body<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">flex (486px)<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">list 44% · vertical rule · preview 56%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">Footer<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">1 row (30px)<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">global keymap hints<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Target size is 80% of the host terminal, clamped to 100×34 cells (prototype: 1180px wide). Below 60 cells wide, drop the preview pane and show it on demand (§7.4). Below 20 rows, drop the footer hints to a single <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">?<\u002Fspan> affordance. The list pane owns a one-row status strip at its bottom edge: scope on the left (<span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">tree · target groups<\u002Fspan> / <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">flat leaves · fuzzy<\u002Fspan>), cursor position on the right (<span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">6/12<\u002Fspan>).<\u002Fp>\n\n  <figure style=\"margin:16px 0 20px;break-inside:avoid\">\n    <img src=\"533bece0-754b-4813-94ae-73309fb0f21e\" alt=\"Browse mode, all groups collapsed\" style=\"width:100%;display:block;border:1px solid #363a4f;border-radius:6px\">\n    <figcaption style=\"font:11.5px 'JetBrains Mono',monospace;color:#6e738d;margin-top:6px\">Fig 1 — Browse mode, root level. Five target groups; the right-hand meta column states each group's drill-down shape. Preview shows the group summary.<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">3. The two modes<\u002Fh2>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Mode is <strong>derived, never toggled<\u002Fstrong>: <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">mode = if query.is_empty() { Browse } else { Search }<\u002Fspan>. There is no mode key, and no state that survives the transition except the query itself. Consequences the implementation must respect:<\u002Fp>\n  <ul style=\"font:14px/1.6 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px;padding-left:20px\">\n    <li>Typing the first character enters search mode; deleting the last character returns to browse mode with the tree's expansion state exactly as it was.<\u002Fli>\n    <li>The cursor index resets to 0 on every query mutation (insert or delete). Re-ranking makes a preserved index meaningless.<\u002Fli>\n    <li>Expansion state (<span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">expanded: Set&lt;NodeId&gt;<\u002Fspan>) is untouched by searching. It is the browse view's state alone.<\u002Fli>\n    <li><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">Esc<\u002Fspan> is two-stage: in search mode it clears the query (back to browse); in browse mode it closes the popup.<\u002Fli>\n  <\u002Ful>\n  <pre style=\"background:#1e2030;color:#cad3f5;font:12px/1.65 'JetBrains Mono',monospace;padding:12px 14px;border-radius:5px;margin:10px 0 14px;break-inside:avoid;overflow:hidden\">Browse                                   Search\n  ┌──────────────────┐   printable char   ┌──────────────────┐\n  │ tree of groups   │ ─────────────────► │ flat leaf list   │\n  │ groups expandable│                    │ fuzzy + ranked   │\n  │ ⏎ = expand/enter │ ◄───────────────── │ ⏎ = run action   │\n  └──────────────────┘  backspace to \"\"   └──────────────────┘\n        │ Esc                                   │ Esc\n        ▼                                       ▼\n      close                                clear query<\u002Fpre>\n\n  <h3 style=\"font:600 14.5px 'IBM Plex Sans',sans-serif;color:#24273a;margin:16px 0 6px\">3.1 Browse mode<\u002Fh3>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">A single-selection tree. Rows are indented 2 cells (14px) per depth level, prefixed by a twisty (<span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">▾<\u002Fspan> open, <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">▸<\u002Fspan> closed, blank for leaves) and a kind glyph. Both branches and leaves are selectable — the cursor moves through the visible flattening of the tree, never into a collapsed subtree.<\u002Fp>\n\n  <figure style=\"margin:16px 0 20px;break-inside:avoid\">\n    <img src=\"e1335bb8-aff7-4fe5-9fbc-8f40636ebb9a\" alt=\"Session group drilled down to a pane\" style=\"width:100%;display:block;border:1px solid #363a4f;border-radius:6px\">\n    <figcaption style=\"font:11.5px 'JetBrains Mono',monospace;color:#6e738d;margin-top:6px\">Fig 2 — Session drill-down: workspace → tab → pane, with the pane's live scrollback in the preview. Note the depth indentation and the per-kind glyph (◫ workspace, ▤ tab, ▪ pane).<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <h3 style=\"font:600 14.5px 'IBM Plex Sans',sans-serif;color:#24273a;margin:16px 0 6px\">3.2 Search mode<\u002Fh3>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">The tree is replaced by <strong>the fully rolled-out set of leaves only<\u002Fstrong> — every pane, agent, directory and plugin in one list, no branches, no indentation. Each row shows its own path as a breadcrumb prefix, dimmed, so a leaf is unambiguous without its tree: <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">herdr-dev › editor › nvim src/switcher.rs<\u002Fspan>. The query fuzzy-filters and re-ranks this list (§6). The preview pane behaves identically to browse mode.<\u002Fp>\n\n  <figure style=\"margin:16px 0 20px;break-inside:avoid\">\n    <img src=\"1df5d461-5bcc-49b7-bb6d-86b7115a0027\" alt=\"Search mode with fuzzy matches\" style=\"width:100%;display:block;border:1px solid #363a4f;border-radius:6px\">\n    <figcaption style=\"font:11.5px 'JetBrains Mono',monospace;color:#6e738d;margin-top:6px\">Fig 3 — Search mode. Badge flips to SEARCH, counts become <span style=\"color:#33344a\">matches / total leaves<\u002Fspan>, breadcrumbs are dimmed, matched characters are peach and bold. Groups have disappeared entirely.<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">4. Target groups and the node model<\u002Fh2>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Five groups at root, in this fixed order. The order is deliberate: the two groups whose contents are <em>live and volatile<\u002Fem> (your session, your agents) come first because they are the reason you opened the popup mid-task; the three <em>stable<\u002Fem> groups follow, ordered by how explicitly you chose them.<\u002Fp>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font:12.5px 'IBM Plex Sans',sans-serif;margin:6px 0 14px\">\n    <sc-raw-thead><sc-raw-tr>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">#<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">GROUP<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">SHAPE<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">LEAF KIND<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">SORT<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">1<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">Session<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">3-level tree: workspace / tab / pane<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">pane<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">session order, active workspace first<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">2<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">Agents<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">flat list<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">agent<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">waiting → working → idle, then recency<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">3<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">Pinned dirs<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">flat list<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">dir<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">config file order (slot ⌘1–⌘9)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">4<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">zoxide<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">flat list<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">zox<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">frecency score, descending<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">5<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">Plugins<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">flat list<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">plugin<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">name, errors surfaced in group meta<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Groups are collapsed by default except Session, which opens to its active workspace and that workspace's active tab. Restoring the previous expansion set across invocations is optional; if implemented, expire it after 10 minutes so a stale tree never greets you.<\u002Fp>\n\n  <figure style=\"margin:16px 0 20px;break-inside:avoid\">\n    <img src=\"469de314-6d43-49f3-b9b5-da7b28e855e3\" alt=\"Agents group expanded\" style=\"width:100%;display:block;border:1px solid #363a4f;border-radius:6px\">\n    <figcaption style=\"font:11.5px 'JetBrains Mono',monospace;color:#6e738d;margin-top:6px\">Fig 4 — Agents: a flat list of agent panes with status in the meta column. The selected agent is blocked on a confirmation prompt; the preview shows the question verbatim so you can decide before jumping.<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <h3 style=\"font:600 14.5px 'IBM Plex Sans',sans-serif;color:#24273a;margin:16px 0 6px\">4.1 Node structure<\u002Fh3>\n  <pre style=\"background:#1e2030;color:#cad3f5;font:12px/1.65 'JetBrains Mono',monospace;padding:12px 14px;border-radius:5px;margin:10px 0 14px;break-inside:avoid;overflow:hidden\">enum Kind { Group, Workspace, Tab, Pane, Dir, Zox, Plugin, Agent }\n\nstruct Node {\n    id:       NodeId,        // stable, provider-scoped: \"session:%2\", \"zox:/home/dd/dotfiles\"\n    kind:     Kind,\n    label:    String,        // what the row shows: command, path, plugin name\n    meta:     String,        // right-aligned column: \"%2\", \"902\", \"waiting\", \"v0.3.0\"\n    crumbs:   Option<string>,// \"herdr-dev › editor\"  — set on LEAVES ONLY, for search mode\n    children: Vec<node>,     // empty ⇒ leaf ⇒ appears in search mode\n    preview:  Preview,       // §7 — resolved lazily, cached per id\n    actions:  Actions,       // §8.2 — default + alternate\n}<\u002Fnode><\u002Fstring><\u002Fpre>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Two rules make the rest of the UI fall out for free. <strong>Leaf-ness is structural<\u002Fstrong> (<span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">children.is_empty()<\u002Fspan>), so search mode is one recursive walk with no per-group special-casing. <strong>Crumbs are precomputed<\u002Fstrong> at tree build time, so search-mode rows need no upward traversal during keystroke handling.<\u002Fp>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">5. Providers<\u002Fh2>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">One provider per group, each producing a subtree and resolving previews for its own nodes. Providers are cheap to enumerate and lazy to preview.<\u002Fp>\n  <pre style=\"background:#1e2030;color:#cad3f5;font:12px/1.65 'JetBrains Mono',monospace;padding:12px 14px;border-radius:5px;margin:10px 0 14px;break-inside:avoid;overflow:hidden\">trait Provider {\n    fn id(&amp;self) -&gt; &amp;'static str;              // \"session\" | \"agents\" | \"pinned\" | \"zoxide\" | \"plugins\"\n    fn enumerate(&amp;self) -&gt; Result&lt;Node&gt;;       // must return in &lt; 30ms, cached data OK\n    fn preview(&amp;self, id: &amp;NodeId) -&gt; Preview;  // may block up to 80ms; render stale + spinner past that\n    fn invoke(&amp;self, id: &amp;NodeId, act: Act) -&gt; Result&lt;Outcome&gt;;\n}<\u002Fpre>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font:12.5px 'IBM Plex Sans',sans-serif;margin:6px 0 14px\">\n    <sc-raw-thead><sc-raw-tr>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">PROVIDER<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">SOURCE<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">REFRESH<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">session<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">herdr daemon IPC: workspace/tab/pane graph, pane pids, cwd, last command, scrollback tail<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">on open + on daemon event<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">agents<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">agent-detect<\u002Fspan> plugin: <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">agent.start<\u002Fspan>/<span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">agent.stop<\u002Fspan> hooks, else process-tree heuristic<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">on open + on hook fire<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">pinned<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">~/.config/herdr/targets.toml<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">on file mtime change<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">zoxide<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">zoxide query --list --score<\u002Fspan>, top 50, existing paths only<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">on open (cache 30s)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">plugins<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">plugin registry: name, version, enabled, load error, declared actions<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">on open<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">A provider that fails must not break the popup: its group row stays, its meta becomes <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#a3384a\">unavailable<\u002Fspan> in red, and its preview shows the error text. Agents and Session must reflect reality at the moment of opening — a jump to a dead pane is the one failure users will not forgive.<\u002Fp>\n\n  <figure style=\"margin:16px 0 20px;break-inside:avoid\">\n    <img src=\"38608f66-1f13-4616-9030-9b6b462085e2\" alt=\"zoxide group expanded with directory preview\" style=\"width:100%;display:block;border:1px solid #363a4f;border-radius:6px\">\n    <figcaption style=\"font:11.5px 'JetBrains Mono',monospace;color:#6e738d;margin-top:6px\">Fig 5 — zoxide entries carry their frecency score in the meta column; the preview adds git branch/dirty state (via the <span style=\"color:#33344a\">git-status<\u002Fspan> plugin), a directory listing, and last-visit recency.<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">6. Search: flattening, matching, ranking<\u002Fh2>\n  <h3 style=\"font:600 14.5px 'IBM Plex Sans',sans-serif;color:#24273a;margin:16px 0 6px\">6.1 The haystack<\u002Fh3>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Build once per invocation (not per keystroke): a <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">Vec&lt;Leaf&gt;<\u002Fspan> from a depth-first walk of all five subtrees, in group order. Each leaf's match text is <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">crumbs + \" › \" + label<\u002Fspan> — crumbs are searchable, which is what lets <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">editor nvim<\u002Fspan> and <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">notes zsh<\u002Fspan> work as queries. Store the crumb prefix length alongside, so rendering knows which characters to dim.<\u002Fp>\n\n  <h3 style=\"font:600 14.5px 'IBM Plex Sans',sans-serif;color:#24273a;margin:16px 0 6px\">6.2 Matching<\u002Fh3>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Case-insensitive greedy subsequence match, left to right; a leaf whose match text does not contain the query as a subsequence is dropped. Return the matched character indices — they are needed for highlighting, and their distribution is the score.<\u002Fp>\n  <pre style=\"background:#1e2030;color:#cad3f5;font:12px/1.65 'JetBrains Mono',monospace;padding:12px 14px;border-radius:5px;margin:10px 0 14px;break-inside:avoid;overflow:hidden\">score  = Σ (8.0 if index == prev_index + 1 else 0.0)   // consecutive-run bonus\n       − Σ (0.4 × gap_before_this_char)                 // scattered matches are worse\n       − 0.6 × first_match_index                        // prefix matches win\n       + 4.0 if match starts at a word boundary         // after / › · space _ -\n       + provider_bias                                  // §6.3<\u002Fpre>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Sort descending by score; ties break by the haystack's original order, which means group order, which means live things before stored things. Do not use a smarter algorithm than this without also making it deterministic — users learn the ranking, and a ranking that reshuffles is worse than one that is merely imperfect.<\u002Fp>\n\n  <h3 style=\"font:600 14.5px 'IBM Plex Sans',sans-serif;color:#24273a;margin:16px 0 6px\">6.3 Provider bias<\u002Fh3>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Applied as a flat additive constant so it nudges rather than dominates: agents needing input <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">+6<\u002Fspan>, live panes <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">+4<\u002Fspan>, pinned dirs <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">+3<\u002Fspan>, other agents <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">+2<\u002Fspan>, zoxide <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">+0<\u002Fspan>, plugins <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">−2<\u002Fspan>. Plugins are last because they are the only group you rarely reach for mid-flow.<\u002Fp>\n\n  <h3 style=\"font:600 14.5px 'IBM Plex Sans',sans-serif;color:#24273a;margin:16px 0 6px\">6.4 Highlighting<\u002Fh3>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Render the match text as runs, not per character: coalesce adjacent characters that share a colour into one span/attribute run. Matched characters are <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">peach #f5a97f<\u002Fspan> and bold, in both the crumb prefix and the label. Unmatched crumb characters use <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">surface2 #5b6078<\u002Fspan>; unmatched label characters use <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">subtext0 #a5adcb<\u002Fspan>, or <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">text #cad3f5<\u002Fspan> on the selected row.<\u002Fp>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">7. Preview pane<\u002Fh2>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">One shape for every node kind, in four stacked regions. It is the only place in the popup where content is allowed to be dense.<\u002Fp>\n  <pre style=\"background:#1e2030;color:#cad3f5;font:12px/1.65 'JetBrains Mono',monospace;padding:12px 14px;border-radius:5px;margin:10px 0 14px;break-inside:avoid;overflow:hidden\">struct Preview {\n    icon: Glyph, title: String,   // kind glyph + primary identity\n    subtitle: String,             // provenance: full path, or crumbs + pane id + detection source\n    chips: Vec&lt;Chip&gt;,             // 1–3 status pills, coloured by semantics\n    body_label: &amp;'static str,     // \"PANE PREVIEW\" | \"DIRECTORY\" | \"AGENT TRANSCRIPT\" | \"PLUGIN\" | \"SUMMARY\"\n    body: Vec&lt;Line&gt;,              // monospace, pre-wrapped, clipped — never scrollable\n    action: String, alt: String,  // footer: default action name, alternate hint\n}<\u002Fpre>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font:12.5px 'IBM Plex Sans',sans-serif;margin:6px 0 14px\">\n    <sc-raw-thead><sc-raw-tr>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">KIND<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">BODY<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">CHIPS<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">pane<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">last N lines of live scrollback, ANSI colour preserved; footer line = cwd + cursor position<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">focused/running, pid, cpu<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">workspace / tab<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">child inventory, plus an ASCII split diagram for a tab's layout<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">active/detached, layout name<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">dir / zox<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">first ~8 entries (dirs first), then last-visit recency and hit count<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">git branch + dirty, entry count<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">agent<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">tail of the agent transcript; if blocked, the pending question and its options verbatim<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">status + duration, token count<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">plugin<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">one-line description, declared hooks, matched objects; load error with file and line if failing<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">enabled/error, version<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">group<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">aggregate roster of its children + one line explaining the group's role<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">counts, error counts<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\"><strong>7.4 Behaviour.<\u002Fstrong> The preview is read-only and never scrolls — it is clipped at the pane's height, because a preview you have to navigate has stopped being a preview. Resolution is debounced 60ms after the cursor settles; while a slow provider resolves, keep the previous preview visible and dim it rather than flashing empty. On narrow terminals the pane is hidden and bound to a toggle key, with the list widening to full width.<\u002Fp>\n\n  <figure style=\"margin:16px 0 20px;break-inside:avoid\">\n    <img src=\"29039fbe-5313-43ed-a58b-ccad82c2909a\" alt=\"Plugin with a load error selected\" style=\"width:100%;display:block;border:1px solid #363a4f;border-radius:6px\">\n    <figcaption style=\"font:11.5px 'JetBrains Mono',monospace;color:#6e738d;margin-top:6px\">Fig 6 — Failure states live in the preview, not in a dialog: a plugin that failed to load shows its error and source location, and its default action becomes \"view error\" rather than \"run plugin action\".<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">8. Keymap and actions<\u002Fh2>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font:12.5px 'IBM Plex Sans',sans-serif;margin:6px 0 14px\">\n    <sc-raw-thead><sc-raw-tr>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">KEY<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">BROWSE<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">SEARCH<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;font-family:'JetBrains Mono',monospace;color:#181926\">↓ / ^n<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">next visible row (wraps)<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">next match (wraps)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;font-family:'JetBrains Mono',monospace;color:#181926\">↑ / ^p<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">previous visible row (wraps)<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">previous match (wraps)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;font-family:'JetBrains Mono',monospace;color:#181926\">→ / Space / Tab<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">expand node; if already open, step to first child<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">→ / Tab inert; <strong>Space types a space<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;font-family:'JetBrains Mono',monospace;color:#181926\">←<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">collapse node; if already closed, jump to parent<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">inert<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;font-family:'JetBrains Mono',monospace;color:#181926\">⏎<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">branch → toggle; leaf → default action, close<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">default action, close<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;font-family:'JetBrains Mono',monospace;color:#181926\">a–z 0–9 …<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">enter search mode with that character<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">append to query, re-rank, cursor → 0<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;font-family:'JetBrains Mono',monospace;color:#181926\">⌫<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">—<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">delete last char; empty query → browse mode<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;font-family:'JetBrains Mono',monospace;color:#181926\">Esc<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">close popup, no action<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">clear query → browse mode<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;font-family:'JetBrains Mono',monospace;color:#181926\">^p<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\" colspan=\"2\">pin the selected directory (or the selected pane's cwd) into Pinned dirs; toast, stay open<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;font-family:'JetBrains Mono',monospace;color:#181926\">^d<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\" colspan=\"2\">kill the selected pane / tab / workspace; confirm inline in the footer; stay open<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;font-family:'JetBrains Mono',monospace;color:#181926\">^t<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\" colspan=\"2\">on a dir / zoxide entry: open the workspace-template picker (§8.4)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;font-family:'JetBrains Mono',monospace;color:#181926\">^r ^c ^x<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\" colspan=\"2\">context alternates (restart command, interrupt agent, detach agent), named per item in the preview footer (§8.2)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Footer hints are mode-aware: <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">⏎ open / expand<\u002Fspan> and <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">esc close<\u002Fspan> in browse mode become <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">⏎ run default action<\u002Fspan> and <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">esc clear<\u002Fspan> in search mode. Nothing else in the footer changes between modes.<\u002Fp>\n\n  <h3 style=\"font:600 14.5px 'IBM Plex Sans',sans-serif;color:#24273a;margin:16px 0 6px\">8.2 Default and alternate action per kind<\u002Fh3>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font:12.5px 'IBM Plex Sans',sans-serif;margin:6px 0 14px\">\n    <sc-raw-thead><sc-raw-tr>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">KIND<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">⏎ DEFAULT<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;border-bottom:1px solid #24273a;padding:6px 8px;font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5b6078\">ALTERNATE<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">pane<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\"><strong>jump to the pane<\u002Fstrong> (switch workspace + tab + focus pane)<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">^d kill pane · ^r restart command<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">agent<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\"><strong>jump to the pane<\u002Fstrong> the agent runs in — identical to a pane jump<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">^c interrupt · ^x detach<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">workspace / tab<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">switch to it, keeping its active pane<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">^p pin · ^d kill<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">dir / zox<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\"><strong>always open a new workspace<\u002Fstrong> at that path — a <em>worktree-space<\u002Fem> if the path is inside a git repository, a plain workspace otherwise. The current workspace is never reused.<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">^t open with template (§8.4) · ^p pin<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">plugin<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\"><strong>open the plugin's action picker<\u002Fstrong> (§8.3), default action preselected; \"view error\" if the plugin failed to load<\u002Fsc-raw-td><sc-raw-td style=\"border-bottom:1px solid #e6e6ec;padding:6px 8px;color:#33344a\">—<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">The default action is <strong>always named in the preview footer<\u002Fstrong> before you commit to it — Enter is never a guess. Executing it closes the popup and shows a one-line toast in the host terminal naming what happened; non-destructive side actions (pin) keep the popup open and toast in place. There is no enable/disable toggle in the switcher — plugin lifecycle belongs to config, not to a jump UI.<\u002Fp>\n\n  <h3 style=\"font:600 14.5px 'IBM Plex Sans',sans-serif;color:#24273a;margin:16px 0 6px\">8.3 Secondary selector (plugins)<\u002Fh3>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Enter on a plugin does not execute anything. It replaces the list pane with a small selector listing <strong>every action that plugin declares<\u002Fstrong>, in declaration order, with the plugin's default action preselected. Same row grammar as the main list, so the muscle memory carries: ↑↓ move, ⏎ runs the highlighted action and closes the popup, Esc returns to the switcher with the plugin still selected. The preview pane switches to the highlighted action's own description and, where the plugin provides one, a dry-run summary of what it will touch.<\u002Fp>\n  <pre style=\"background:#1e2030;color:#cad3f5;font:12px/1.65 'JetBrains Mono',monospace;padding:12px 14px;border-radius:5px;margin:10px 0 14px;break-inside:avoid;overflow:hidden\">❯ agent-detect                                    ▸ ACTION\n  ▸ rescan panes                        default     rescan panes\n    reload hooks                                    Re-runs process-tree detection across\n    list matched panes                              all panes and re-tags agent panes.\n    dump detection log                              touches: 7 panes · no side effects\n                                                    ⏎ run  esc back<\u002Fpre>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">A plugin declaring exactly one action still shows the picker — it stays predictable, and one row is cheap. A plugin declaring none is not selectable: its default action becomes \"view error\" or \"no actions declared\", and Enter is inert.<\u002Fp>\n\n  <h3 style=\"font:600 14.5px 'IBM Plex Sans',sans-serif;color:#24273a;margin:16px 0 6px\">8.4 Optional: open-with-template (dirs and zoxide)<\u002Fh3>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">^t<\u002Fspan> on a directory or zoxide entry opens the same selector shape, listing the <strong>configured workspace templates<\u002Fstrong> — a tmuxinator-style declaration of tabs, panes, splits and startup commands — with one preselected: the template whose <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">match<\u002Fspan> pattern fits the path, else the configured default. Enter opens a new workspace (or worktree-space) at that path built from the highlighted template; Esc returns.<\u002Fp>\n  <pre style=\"background:#1e2030;color:#cad3f5;font:12px/1.65 'JetBrains Mono',monospace;padding:12px 14px;border-radius:5px;margin:10px 0 14px;break-inside:avoid;overflow:hidden\"># ~/.config/herdr/templates.toml\n[[template]]\nname    = \"rust-dev\"            # shown in the picker\nmatch   = [\"**/Cargo.toml\"]     # auto-preselect when the target path matches\ntabs    = [\n  { name = \"editor\", panes = [\"nvim .\", \"cargo watch -x test\"], split = \"v\", ratio = 60 },\n  { name = \"shell\",  panes = [\"zsh\"] },\n]\n\n[[template]]\nname    = \"plain\"               # the fallback default\ndefault = true\ntabs    = [{ name = \"shell\", panes = [\"zsh\"] }]<\u002Fpre>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">The feature is optional: with no <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">templates.toml<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">^t<\u002Fspan> is unbound and the preview footer omits the hint. Plain Enter never consults templates beyond the default one — the picker is the only place a template is chosen explicitly.<\u002Fp>\n\n  <figure style=\"margin:16px 0 20px;break-inside:avoid\">\n    <img src=\"82688fd9-2e6d-48b2-abf1-b7ddd9e713f5\" alt=\"Executing the default action from search mode\" style=\"width:100%;display:block;border:1px solid #363a4f;border-radius:6px\">\n    <figcaption style=\"font:11.5px 'JetBrains Mono',monospace;color:#6e738d;margin-top:6px\">Fig 7 — Enter in search mode: the toast names the action, the target, and the fact that the popup closed. Note that a two-character query already separates a pinned dir from a live pane.<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">9. Theme — Catppuccin Macchiato<\u002Fh2>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Palette is fixed; the mapping below is the contract. Never introduce a colour outside the palette, and never use colour as the only carrier of meaning — every coloured state also has a word in the meta column or a chip label.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px;break-inside:avoid\">\n    <div style=\"border:1px solid #e2e2ea;border-radius:5px;overflow:hidden\"><div style=\"height:34px;background:#24273a\"><\u002Fdiv><div style=\"padding:5px 7px;font:10.5px 'JetBrains Mono',monospace;color:#5b6078\">base #24273a<br><span style=\"color:#181926\">popup body<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #e2e2ea;border-radius:5px;overflow:hidden\"><div style=\"height:34px;background:#1e2030\"><\u002Fdiv><div style=\"padding:5px 7px;font:10.5px 'JetBrains Mono',monospace;color:#5b6078\">mantle #1e2030<br><span style=\"color:#181926\">bars, preview bg<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #e2e2ea;border-radius:5px;overflow:hidden\"><div style=\"height:34px;background:#181926\"><\u002Fdiv><div style=\"padding:5px 7px;font:10.5px 'JetBrains Mono',monospace;color:#5b6078\">crust #181926<br><span style=\"color:#181926\">dimmed host term<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #e2e2ea;border-radius:5px;overflow:hidden\"><div style=\"height:34px;background:#363a4f\"><\u002Fdiv><div style=\"padding:5px 7px;font:10.5px 'JetBrains Mono',monospace;color:#5b6078\">surface0 #363a4f<br><span style=\"color:#181926\">selection, rules<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #e2e2ea;border-radius:5px;overflow:hidden\"><div style=\"height:34px;background:#cad3f5\"><\u002Fdiv><div style=\"padding:5px 7px;font:10.5px 'JetBrains Mono',monospace;color:#5b6078\">text #cad3f5<br><span style=\"color:#181926\">selected label<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #e2e2ea;border-radius:5px;overflow:hidden\"><div style=\"height:34px;background:#a5adcb\"><\u002Fdiv><div style=\"padding:5px 7px;font:10.5px 'JetBrains Mono',monospace;color:#5b6078\">subtext0 #a5adcb<br><span style=\"color:#181926\">unselected label<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #e2e2ea;border-radius:5px;overflow:hidden\"><div style=\"height:34px;background:#5b6078\"><\u002Fdiv><div style=\"padding:5px 7px;font:10.5px 'JetBrains Mono',monospace;color:#5b6078\">surface2 #5b6078<br><span style=\"color:#181926\">crumbs, meta<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #e2e2ea;border-radius:5px;overflow:hidden\"><div style=\"height:34px;background:#c6a0f6\"><\u002Fdiv><div style=\"padding:5px 7px;font:10.5px 'JetBrains Mono',monospace;color:#5b6078\">mauve #c6a0f6<br><span style=\"color:#181926\">prompt, caret, group<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #e2e2ea;border-radius:5px;overflow:hidden\"><div style=\"height:34px;background:#f5a97f\"><\u002Fdiv><div style=\"padding:5px 7px;font:10.5px 'JetBrains Mono',monospace;color:#5b6078\">peach #f5a97f<br><span style=\"color:#181926\">match hits, SEARCH<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #e2e2ea;border-radius:5px;overflow:hidden\"><div style=\"height:34px;background:#7dc4e4\"><\u002Fdiv><div style=\"padding:5px 7px;font:10.5px 'JetBrains Mono',monospace;color:#5b6078\">sapphire #7dc4e4<br><span style=\"color:#181926\">BROWSE badge<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #e2e2ea;border-radius:5px;overflow:hidden\"><div style=\"height:34px;background:#a6da95\"><\u002Fdiv><div style=\"padding:5px 7px;font:10.5px 'JetBrains Mono',monospace;color:#5b6078\">green #a6da95<br><span style=\"color:#181926\">agents, ok, action<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #e2e2ea;border-radius:5px;overflow:hidden\"><div style=\"height:34px;background:#ed8796\"><\u002Fdiv><div style=\"padding:5px 7px;font:10.5px 'JetBrains Mono',monospace;color:#5b6078\">red #ed8796<br><span style=\"color:#181926\">errors, blocked<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">Kind glyph + colour: workspace <span style=\"font-family:'JetBrains Mono',monospace\">◫<\u002Fspan> lavender <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">#b7bdf8<\u002Fspan>, tab <span style=\"font-family:'JetBrains Mono',monospace\">▤<\u002Fspan> sky <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">#91d7e3<\u002Fspan>, pane <span style=\"font-family:'JetBrains Mono',monospace\">▪<\u002Fspan> blue <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">#8aadf4<\u002Fspan>, dir <span style=\"font-family:'JetBrains Mono',monospace\">/<\u002Fspan> yellow <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">#eed49f<\u002Fspan>, zoxide <span style=\"font-family:'JetBrains Mono',monospace\">/<\u002Fspan> teal <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">#8bd5ca<\u002Fspan>, plugin <span style=\"font-family:'JetBrains Mono',monospace\">⬢<\u002Fspan> pink <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">#f5bde6<\u002Fspan>, agent <span style=\"font-family:'JetBrains Mono',monospace\">◆<\u002Fspan> green <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">#a6da95<\u002Fspan>, group <span style=\"font-family:'JetBrains Mono',monospace\">❯<\u002Fspan> mauve <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">#c6a0f6<\u002Fspan>. Two directory kinds share a glyph and differ only in colour, because they differ only in provenance.<\u002Fp>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\"><strong>Selected row:<\u002Fstrong> <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">surface0<\u002Fspan> background, a 2px left bar in the row's kind colour, label promoted to <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">text<\u002Fspan>. Nothing else marks selection — no bold, no inverse video, no arrow — so the eye tracks one moving band. Fall back to reverse video only on terminals without truecolour.<\u002Fp>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">10. Row rendering rules<\u002Fh2>\n  <p style=\"font:14px/1.62 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px\">One row is one terminal line, laid out as: <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">[indent][twisty 1][glyph 1][gap][label — flexible, truncated][gap 2][meta — right-aligned]<\u002Fspan>. The label truncates with an ellipsis and never wraps; the meta column never truncates and always keeps at least two cells of clearance from the label. When a truncated label would hide a match hit in search mode, truncate from the <em>left<\u002Fem> of the crumb prefix instead, so the hit stays visible.<\u002Fp>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">11. Edge cases and empty states<\u002Fh2>\n  <ul style=\"font:14px/1.6 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px;padding-left:20px\">\n    <li><strong>No matches:<\u002Fstrong> list shows one dim centred line — <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">no targets match \"qzx\"<\u002Fspan> — counts read <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">0/20<\u002Fspan>, preview keeps the last resolved item but dims to 50%, Enter is inert.<\u002Fli>\n    <li><strong>Empty group:<\u002Fstrong> stays visible with <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">empty<\u002Fspan> in the meta column; expanding shows one dim child row explaining how to populate it (e.g. \"no pins — press ^p on a directory\").<\u002Fli>\n    <li><strong>Provider unavailable:<\u002Fstrong> group row meta becomes red <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">unavailable<\u002Fspan>; its leaves are excluded from search rather than shown stale.<\u002Fli>\n    <li><strong>Target dies while open:<\u002Fstrong> on Enter, if the provider reports the target gone, do not close — flash the row red, refresh that provider, keep the query.<\u002Fli>\n    <li><strong>Single match:<\u002Fstrong> never auto-execute. Enter stays an explicit act.<\u002Fli>\n    <li><strong>Duplicate labels<\u002Fstrong> (same command in two panes) are disambiguated by crumbs in search mode and by position in browse mode; never dedupe.<\u002Fli>\n    <li><strong>Very long queries<\u002Fstrong> that match nothing: keep accepting input; do not clear or beep.<\u002Fli>\n  <\u002Ful>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">12. Performance budgets<\u002Fh2>\n  <ul style=\"font:14px/1.6 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px;padding-left:20px\">\n    <li>Open to first paint: <strong>&lt; 60ms<\u002Fstrong>. Paint the chrome and the tree from cached provider data; refresh in place as providers answer.<\u002Fli>\n    <li>Keystroke to re-ranked list: <strong>&lt; 8ms<\u002Fstrong> for 1,000 leaves. Matching is allocation-free per keystroke; reuse the haystack and a scratch score buffer.<\u002Fli>\n    <li>Preview resolution: debounce 60ms, budget 80ms, then show stale-and-dim. Never block the input loop on a provider.<\u002Fli>\n    <li>Redraw only the two rows whose selection changed, plus the preview region.<\u002Fli>\n  <\u002Ful>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">13. Configuration<\u002Fh2>\n  <pre style=\"background:#1e2030;color:#cad3f5;font:12px/1.65 'JetBrains Mono',monospace;padding:12px 14px;border-radius:5px;margin:10px 0 14px;break-inside:avoid;overflow:hidden\"># ~/.config/herdr/switcher.toml\ngroups        = [\"session\", \"agents\", \"pinned\", \"zoxide\", \"plugins\"]  # order = display order\nopen_key      = \"ctrl-k\"\nzoxide_limit  = 50\npreview       = { enabled = true, width_pct = 56, min_cols = 60 }\nexpand        = { session_default = \"active\", restore_ttl_secs = 600 }\nscoring       = { consecutive = 8.0, gap = 0.4, prefix = 0.6, word_boundary = 4.0 }\nbias          = { agent_waiting = 6, pane = 4, pinned = 3, agent = 2, zoxide = 0, plugin = -2 }\n\n# ~/.config/herdr/targets.toml — pinned dirs\n[[pin]] path = \"~/code/herdr\"    slot = 1\n[[pin]] path = \"~/work/infra\"    slot = 2<\u002Fpre>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">14. Acceptance criteria<\u002Fh2>\n  <ol style=\"font:14px/1.6 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px;padding-left:22px\">\n    <li>Opening the popup shows five groups in the order of §4, Session pre-expanded to its active tab, cursor on row 0, preview showing the Session summary.<\u002Fli>\n    <li>Typing one printable character flips the badge to SEARCH, replaces the tree with leaves only, dims crumbs, highlights hits in peach, and resets the cursor to 0.<\u002Fli>\n    <li>Backspacing to an empty query restores the exact prior tree, including expansion state; the cursor returns to row 0.<\u002Fli>\n    <li>→, Space and Tab all expand the selected group in browse mode; Space types a space in search mode.<\u002Fli>\n    <li>← collapses an open node and jumps to the parent of a closed one.<\u002Fli>\n    <li>The preview updates for every cursor move in both modes, and its footer always names the action Enter will perform.<\u002Fli>\n    <li>Enter on a leaf performs that action, closes the popup, and toasts what happened; Enter on a branch in browse mode only toggles it.<\u002Fli>\n    <li>Enter on a pane or an agent lands the user in that pane. Enter on a dir or zoxide entry always creates a new workspace — a worktree-space inside a git repo — and never reuses the current one.<\u002Fli>\n    <li>Enter on a plugin opens its action picker with the default preselected; Esc from the picker returns to the switcher with that plugin still selected.<\u002Fli>\n    <li>Esc clears the query in search mode and closes the popup in browse mode.<\u002Fli>\n    <li>A killed pane, a failed plugin, and an unavailable provider are all representable without any modal dialog.<\u002Fli>\n    <li>All colours used are Catppuccin Macchiato palette entries, and every coloured status is also stated in words.<\u002Fli>\n  <\u002Fol>\n\n  <h2 style=\"font:600 19px 'IBM Plex Sans',sans-serif;color:#181926;margin:26px 0 8px;border-top:1px solid #dcdce4;padding-top:14px\">15. Open questions<\u002Fh2>\n  <ul style=\"font:14px/1.6 'IBM Plex Sans',sans-serif;color:#33344a;margin:0 0 10px;padding-left:20px\">\n    <li>Merge <em>Pinned dirs<\u002Fem> and <em>zoxide<\u002Fem> into one \"Directories\" group with a provenance tag in the meta column? Fewer roots, but loses the pinned/frecency distinction at a glance.<\u002Fli>\n    <li>Should a group name typed as a prefix act as a scope filter (<span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">agents&nbsp;<\u002Fspan> restricting the haystack) rather than as ordinary match text?<\u002Fli>\n    <li><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">^k<\u002Fspan> is drawn in the search bar as the open keybind but has no in-popup function — document it, repurpose it, or drop the affordance.<\u002Fli>\n    <li>Should agents needing input raise a passive notification in the host status line while the popup is closed?<\u002Fli>\n  <\u002Ful>\n<\u002Fdoc-page>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
