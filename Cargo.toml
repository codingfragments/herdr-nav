[package]
name = "herdr-nav"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Herdr plugin: fuzzy navigation between panes, agents, directories, and plugins with rich preview"

[[bin]]
name = "herdr-nav"
path = "src/main.rs"

[dependencies]
ansi-to-tui = "8.0.1"
crossterm = "0.29"
nucleo-matcher = "0.3.1"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
