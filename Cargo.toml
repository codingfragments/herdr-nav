[package]
name = "herdr-nav"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Herdr plugin: fuzzy navigation between panes, agents, directories, and plugins with rich preview"

[[bin]]
name = "herdr-nav"
path = "src/main.rs"

[dependencies]
ansi-to-tui = "8.0.1"
crossterm = "0.29"
# Dev note: pinned to the local checkout until muxhost v0.2.1
# (raw_request + with_socket) is tagged on origin — flip back to
#   git = "https://github.com/codingfragments/muxhost", tag = "v0.2.1"
# before merging.
muxhost = { path = "../muxhost", features = ["topology", "navigate"] }
nucleo-matcher = "0.3.1"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
